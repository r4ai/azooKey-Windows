name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2

    - name: Install Swift
      uses: compnerd/gha-setup-swift@main
      with:
        swift-version: swift-6.1.3-release
        swift-build: 6.1.3-RELEASE
        update-sdk-modules: true

    - name: Set up MSVC developer environment
      uses: compnerd/gha-setup-vsdevenv@f1ba60d553a3216ce1b89abe0201213536bc7557 # v6

    - name: Install Protoc
      uses: arduino/setup-protoc@v3

    - name: Install cargo-make
      run: cargo install --force cargo-make

    - name: Download prebuilt llama
      run: |
        function Download-Extract {
          param (
            [string]$url,
            [string]$destFolder
          )
          $tempZip = Join-Path $env:TEMP "llama_temp.zip"
          Invoke-WebRequest -Uri $url -OutFile $tempZip
          New-Item -Path $destFolder -ItemType Directory -Force
          Expand-Archive -Path $tempZip -DestinationPath $destFolder -Force
          Remove-Item $tempZip
        }

        # AzooKeyKanaKanjiConverter v0.11.2 imports the b4846 C ABI. Keep all
        # runtime backends and the import library on that exact release.
        $llamaVersion = "b4846"
        $llamaReleaseBase = "https://github.com/fkunn1326/llama.cpp/releases/download/$llamaVersion"

        # Create directories
        $llamaCpuDir = "llama_cpu"
        $llamaCudaDir = "llama_cuda"
        $llamaVulkanDir = "llama_vulkan"
        New-Item -Path $llamaCpuDir, $llamaCudaDir, $llamaVulkanDir -ItemType Directory -Force

        # Download and extract files
        Download-Extract -url "$llamaReleaseBase/llama-$llamaVersion-bin-win-avx-x64.zip" -destFolder $llamaCpuDir
        Download-Extract -url "$llamaReleaseBase/llama-$llamaVersion-bin-win-cuda-cu12.4-x64.zip" -destFolder $llamaCudaDir
        Download-Extract -url "$llamaReleaseBase/llama-$llamaVersion-bin-win-vulkan-x64.zip" -destFolder $llamaVulkanDir

        # Copy llama.lib to server-swift
        Copy-Item "$llamaCpuDir\llama.lib" -Destination "server-swift\" -Force

        # Download the zenz model
        $zenzUrl = "https://huggingface.co/Miwa-Keita/zenz-v3-small-gguf/resolve/main/ggml-model-Q5_K_M.gguf"
        $zenzDest = "zenz.gguf"
        Invoke-WebRequest -Uri $zenzUrl -OutFile $zenzDest

    - name: Resolve and patch Zenzai inference dependency
      shell: pwsh
      run: |
        Push-Location server-swift
        swift package resolve
        Pop-Location
        & .\scripts\patch-kkc.ps1 -PackagePath .\server-swift

    - name: Install node dependencies
      run: |
        cd frontend
        npm install

    - name: Build
      run: cargo make build --release

    - name: Upload Setup Artifact
      uses: actions/upload-artifact@v4
      with:
        name: azookey-setup
        path: build/azookey-setup.exe
        if-no-files-found: error
