name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-test:
    name: Frontend Storybook
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "24.18.0"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Build frontend
      run: npm run build

    - name: Build Storybook
      run: npm run build-storybook

    - name: Test Storybook
      run: npm run test-storybook

  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: recursive

    - name: Cache Rust
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

    - name: Install Swift
      uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # main, 2026-07-13
      with:
        swift-version: swift-6.1.3-release
        swift-build: 6.1.3-RELEASE
        update-sdk-modules: true

    - name: Set up MSVC developer environment
      uses: compnerd/gha-setup-vsdevenv@f1ba60d553a3216ce1b89abe0201213536bc7557 # v6

    - name: Install Protoc
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
      with:
        version: "29.6"
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install cargo-make
      run: cargo install cargo-make --version 0.37.24 --locked

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "24.18.0"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Build
      run: cargo make build --release

    - name: Upload Setup Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: azookey-setup
        path: build/azookey-setup.exe
        if-no-files-found: error
