# makefile for cargo
[config]
default_to_workspace = false

[tasks.format]
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.post_build]
description = "Stage built binaries and runtime assets"
command = "powershell"
args = [
    "-NoProfile",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    "./scripts/stage-build.ps1",
    "${@}"
]

[tasks.build]
clear = true
description = "Build and package AzooKey"
command = "powershell"
args = [
    "-NoProfile",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    "./scripts/build.ps1",
    "${@}"
]
