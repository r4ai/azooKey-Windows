# makefile for cargo
[config]
default_to_workspace = false

[tasks.format]
command = "cargo"
args = ["fmt"]

[tasks.build_swift]
description = "Build the swift code"
script_runner = "@shell"
script = """
cd server-swift
swift package resolve
powershell -NoProfile -ExecutionPolicy Bypass -File ../scripts/patch-kkc.ps1 -PackagePath .
swift build -c release --disable-automatic-resolution
cp .build/x86_64-unknown-windows-msvc/release/azookey-server.lib ../
"""

[tasks.build_x64]
command = "cargo"
args = ["build", "${@}"]

[tasks.build_x86]
command = "cargo"
args = ["build", "-p", "azookey-windows", "--target=i686-pc-windows-msvc", "${@}"]

[tasks.build_tauri]
description = "Build the swift code"
script_runner = "@shell"
script = """
cd frontend
npm run tauri build
"""

[tasks.build_installer]
command = "iscc"
args = ["./installer/Installer.iss"]

[tasks.post_build]
description = "Copy necessary files"
script_runner = "powershell"
script_extension = "ps1"
script  = """
$ErrorActionPreference = "Stop"

$str=$args[0]
if ([string]::IsNullOrEmpty($str)) {
    $str = "debug"
} else {
    $str=$str.Substring(2)
}

$workspaceRoot = (Get-Location).Path.TrimEnd('\\')
$buildDir = [System.IO.Path]::GetFullPath((Join-Path $workspaceRoot "build"))
$id = [guid]::NewGuid().ToString("N")
$stagingDir = Join-Path $workspaceRoot ".azookey-build-staging-$id"
$backupDir = Join-Path $workspaceRoot ".azookey-build-backup-$id"

function Remove-WorkspaceChildDirectory {
    param([Parameter(Mandatory = $true)][string]$Path)

    $fullPath = [System.IO.Path]::GetFullPath($Path).TrimEnd('\\')
    $parentPath = [System.IO.Directory]::GetParent($fullPath).FullName.TrimEnd('\\')
    if (-not $parentPath.Equals($workspaceRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
        throw "Refusing to remove a directory outside the workspace: $fullPath"
    }
    if ([System.IO.Directory]::Exists($fullPath)) {
        [System.IO.Directory]::Delete($fullPath, $true)
    }
}

try {
    New-Item -Path (Join-Path $stagingDir "x86") -ItemType Directory -Force | Out-Null

    Copy-Item -LiteralPath "target/$str/ui.exe" -Destination $stagingDir
    Copy-Item -LiteralPath "target/$str/azookey-server.exe" -Destination $stagingDir
    Copy-Item -LiteralPath "target/$str/azookey_windows.dll" -Destination $stagingDir
    Copy-Item -LiteralPath "target/$str/launcher.exe" -Destination $stagingDir
    Copy-Item -LiteralPath "target/i686-pc-windows-msvc/$str/azookey_windows.dll" `
        -Destination (Join-Path $stagingDir "x86")
    Copy-Item -LiteralPath "server-swift/.build/x86_64-unknown-windows-msvc/release/azookey-server.dll" `
        -Destination $stagingDir

    Copy-Item -LiteralPath "llama_cpu" -Destination (Join-Path $stagingDir "llama_cpu") -Recurse
    Copy-Item -LiteralPath "llama_cuda" -Destination (Join-Path $stagingDir "llama_cuda") -Recurse
    Copy-Item -LiteralPath "llama_vulkan" -Destination (Join-Path $stagingDir "llama_vulkan") -Recurse

    $swiftTargetInfoJson = & swift -print-target-info
    if ($LASTEXITCODE -ne 0) {
        throw "swift -print-target-info failed with exit code $LASTEXITCODE."
    }
    $swiftTargetInfo = $swiftTargetInfoJson | Out-String | ConvertFrom-Json
    $swiftRuntimeBin = @($swiftTargetInfo.paths.runtimeLibraryPaths) |
        Where-Object { Test-Path -LiteralPath (Join-Path $_ "swiftCore.dll") } |
        Select-Object -First 1
    if ([string]::IsNullOrEmpty($swiftRuntimeBin)) {
        throw "Could not find the runtime bin directory for the active Swift toolchain."
    }
    Get-ChildItem -LiteralPath $swiftRuntimeBin -Force |
        Copy-Item -Destination $stagingDir -Recurse -Force

    Copy-Item -LiteralPath "server-swift/azooKey_emoji_dictionary_storage/EmojiDictionary" `
        -Destination (Join-Path $stagingDir "EmojiDictionary") -Recurse
    Copy-Item -LiteralPath "server-swift/azooKey_dictionary_storage/Dictionary" `
        -Destination (Join-Path $stagingDir "Dictionary") -Recurse
    Copy-Item -LiteralPath "zenz.gguf" -Destination $stagingDir

    & icacls.exe (Join-Path $stagingDir "azookey_windows.dll") /grant "*S-1-15-2-1:(RX)"
    if ($LASTEXITCODE -ne 0) {
        throw "icacls failed for the x64 IME DLL with exit code $LASTEXITCODE."
    }
    & icacls.exe (Join-Path $stagingDir "x86/azookey_windows.dll") /grant "*S-1-15-2-1:(RX)"
    if ($LASTEXITCODE -ne 0) {
        throw "icacls failed for the x86 IME DLL with exit code $LASTEXITCODE."
    }

    if ([System.IO.Directory]::Exists($buildDir)) {
        Move-Item -LiteralPath $buildDir -Destination $backupDir
    }
    try {
        Move-Item -LiteralPath $stagingDir -Destination $buildDir
    }
    catch {
        if (-not (Test-Path -LiteralPath $buildDir) -and
            (Test-Path -LiteralPath $backupDir -PathType Container)) {
            Move-Item -LiteralPath $backupDir -Destination $buildDir
        }
        throw
    }

    if (Test-Path -LiteralPath $backupDir -PathType Container) {
        try {
            Remove-WorkspaceChildDirectory $backupDir
        }
        catch {
            Write-Warning "The previous build remains at $backupDir and can be removed after closing processes that use it."
        }
    }
}
finally {
    if (Test-Path -LiteralPath $stagingDir -PathType Container) {
        Remove-WorkspaceChildDirectory $stagingDir
    }
}
"""
args = ["${@}"]

[tasks.build]
clear = true
description = "Run the flow"
dependencies = [
    "format",
    "build_swift",
    "build_x64",
    "build_x86",
    "build_tauri",
    "post_build",
    "build_installer"
]
